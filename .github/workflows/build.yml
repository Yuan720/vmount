name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install MinGW-w64 (cgo dependency)
        run: choco install mingw-w64 -y --no-progress

      - name: Build
        shell: pwsh
        run: |
          $env:Path += ";C:\ProgramData\chocolatey\lib\mingw-w64\tools\mingw64\bin"
          gcc --version
          $env:CGO_ENABLED = "1"
          go build -trimpath -ldflags "-s -w" -o vmount.exe ./cmd/vmount

      - uses: actions/upload-artifact@v4
        with:
          name: vmount-windows
          path: vmount.exe
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vmount.exe
