name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install WinFsp (runtime for local test)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/winfsp/winfsp/releases/latest"
          $msi = $rel.assets | Where-Object { $_.name -like "*.msi" } | Select-Object -First 1
          Invoke-WebRequest $msi.browser_download_url -OutFile winfsp.msi
          $p = Start-Process msiexec -ArgumentList "/i winfsp.msi /qn /norestart" -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"

      - name: Fetch WinFsp FUSE headers (compile only)
        shell: pwsh
        run: |
          git clone --depth 1 --branch v2.1 --filter=blob:none --sparse https://github.com/winfsp/winfsp C:\winfsp-src
          Set-Location C:\winfsp-src
          git sparse-checkout set inc/fuse
          Test-Path C:\winfsp-src\inc\fuse\fuse_common.h

      - name: Build
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;$env:Path"
          $env:CGO_CFLAGS = "-IC:\winfsp-src\inc\fuse"
          gcc --version
          go mod tidy
          $env:CGO_ENABLED = "1"
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go build -trimpath -ldflags "-s -w" -o vmount.exe ./cmd/vmount

      - uses: actions/upload-artifact@v4
        with:
          name: vmount-windows
          path: vmount.exe
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vmount.exe
