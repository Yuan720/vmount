name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install WinFsp (FUSE headers + runtime)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/winfsp/winfsp/releases/latest"
          $msi = $rel.assets | Where-Object { $_.name -like "*.msi" } | Select-Object -First 1
          Invoke-WebRequest $msi.browser_download_url -OutFile winfsp.msi
          Start-Process msiexec -ArgumentList "/i winfsp.msi /qn /norestart" -Wait
          Test-Path "C:\Program Files (x86)\WinFsp\inc\fuse\fuse_common.h"

      - name: Build
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;$env:Path"
          $env:CGO_CFLAGS = '-I"C:\Program Files (x86)\WinFsp\inc\fuse"'
          gcc --version
          go mod tidy
          $env:CGO_ENABLED = "1"
          go build -trimpath -ldflags "-s -w" -o vmount.exe ./cmd/vmount

      - uses: actions/upload-artifact@v4
        with:
          name: vmount-windows
          path: vmount.exe
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vmount.exe
