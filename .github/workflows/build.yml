name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;$env:Path"
          gcc --version
          go mod tidy
          Write-Host "=== go.sum exists: $(Test-Path go.sum) ==="
          if (Test-Path go.sum) { Get-Content go.sum }
          go env GOWORK GOFLAGS GONOSUMDB GOPROXY
          $env:CGO_ENABLED = "1"
          go build -trimpath -ldflags "-s -w" -o vmount.exe ./cmd/vmount

      - uses: actions/upload-artifact@v4
        with:
          name: vmount-windows
          path: vmount.exe
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: vmount.exe
